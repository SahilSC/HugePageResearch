---
# Compaction data collection config for GAP Benchmark Suite
# Graph workloads with large memory footprints — good for TLB pressure.
#
# See compaction_redis.yaml for hook rationale.
benchmark_config:
  generic:
    benchmark: gap
    cpus: 0
    skip_clear_page_cache: false
    transparent_hugepages: always
    overcommit_memory: never_check
  gap:
    gap_benchmark: pr
    gap_benchmark_size: 25
    trials: 2
collector_config:
  generic:
    poll_rate: 0.1
    output_dir: data
    output_graphs: false
    hooks:
      - mm_rss_stat
      - memory_usage
      - perf
      - process_trace
      - smaps_hook
      - vmstat_harness

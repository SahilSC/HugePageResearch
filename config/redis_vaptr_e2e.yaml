---
benchmark_config:
  generic:
    benchmark: redis
    cpus: 0
    skip_clear_page_cache: false
    transparent_hugepages: always
    overcommit_memory: never_check
    khugepaged_scan_sleep_millis: 8640000
  redis:
    repeat: 1
    field_count: 1
    min_field_length: 4096
    field_length: 2097152
    outer_repeat: 1
    thread_count: 1
    record_count: 4096
    operation_count: 4096
    read_proportion: 0.05
    update_proportion: 0.00
    insert_proportion: 0.00
    rmw_proportion: 0.00
    scan_proportion: 0.00
    delete_proportion: 0.95
    field_length_distribution: uniform
    explicit_purge: false
    request_distribution: uniform
    vaptr_num_keys: 10
    vaptr_field_name: field0
collector_config:
  generic:
    poll_rate: 0.1
    output_dir: data
    output_graphs: false
    hooks:
      - vaptr
      - process_trace

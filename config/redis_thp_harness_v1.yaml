---
benchmark_config:
  generic:
    benchmark: redis
    cpus: 0
    skip_clear_page_cache: false
    transparent_hugepages: always
    overcommit_memory: never_check
    khugepaged_scan_sleep_millis: 1000
  redis:
    record_count: 500000
    operation_count: 500000
    field_count: 1
    field_length: 1024
    min_field_length: 1024
    read_proportion: 0.0
    update_proportion: 0.0
    insert_proportion: 0.0
    rmw_proportion: 0.0
    scan_proportion: 0.0
    delete_proportion: 0.5
    request_distribution: "uniform"
    thread_count: 1
    target: 10000
collector_config:
  generic:
    poll_rate: 0.1
    output_dir: data
    output_graphs: true
    hooks:
      - process_trace
      - memory_usage
      - mm_rss_stat
      - perf
      - thp_trace
      - vmstat_harness
      - smaps_harness
  hugepage_harness:
    enabled: true
    redis_name_regex: "redis-server"
    window_ms: [100, 1000, 10000]
    intervention_enabled: true
    intervention_period_s: 10
    intervention_warmup_s: 30
    negative_sample_period_s: 2
    age_bucket_weights: [0.4, 0.4, 0.2]
    matching_enabled: true
    matching:
      enabled: true
    vmstat_interval_ms: 200
    smaps_rollup_interval_ms: 500
    smaps_vma_interval_ms: 2000
    split_debugfs_path: "/sys/kernel/debug/split_huge_pages"
    random_seed: 17

---
# Compaction data collection config for MongoDB (YCSB workload)
# Database workload with mixed read/update — moderate fragmentation.
#
# See compaction_redis.yaml for hook rationale.
# Increase operation_count for longer runs.
benchmark_config:
  generic:
    benchmark: mongodb
    cpus: 0
    skip_clear_page_cache: false
    transparent_hugepages: always
    overcommit_memory: never_check
  mongodb:
    operation_count: 10000
    read_proportion: 0.25
    update_proportion: 0.75
collector_config:
  generic:
    poll_rate: 0.1
    output_dir: data
    output_graphs: false
    hooks:
      - mm_rss_stat
      - memory_usage
      - perf
      - process_trace
      - smaps_harness
      - vmstat_harness

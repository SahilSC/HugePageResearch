# YCSB Workload A configuration for Redis benchmark
# Based on RedisConfig defaults in python/kernmlops/kernmlops_benchmark/redis.py

workload=site.ycsb.workloads.CoreWorkload

# Operation mix (Workload A: 50% reads, 50% updates)
readproportion=0.5
updateproportion=0.5
scanproportion=0.0
insertproportion=0.0
readmodifywriteproportion=0.0
deleteproportion=0.0

# Dataset size
recordcount=1000000
operationcount=1000000

# Field configuration
fieldcount=256
fieldlength=16
minfieldlength=16
fieldlengthdistribution=uniform

# Request distribution
requestdistribution=uniform

# Performance parameters
threadcount=1
target=10000

# Redis connection
redis.host=127.0.0.1
redis.port=6379
